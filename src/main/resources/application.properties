# =====================================================================
#  CONFIGURACIÓN DEL SISTEMA DE GESTIÓN Y SEGUIMIENTO DE DENUNCIAS
# =====================================================================

# Nombre de la aplicación y puerto donde se publica (http://localhost:8080)
spring.application.name=sistema-denuncias
# En Render el puerto lo asigna la plataforma (variable PORT)
server.port=${PORT:8080}
# Render atiende HTTPS delante de la aplicación: se respetan sus cabeceras X-Forwarded-*
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------
#  CONEXIÓN A MySQL (Aiven)
#  Los datos reales se ponen como variables de entorno en Render:
#    DB_URL      jdbc:mysql://HOST:PUERTO/defaultdb?sslMode=REQUIRED
#    DB_USER     avnadmin
#    DB_PASSWORD (contraseña del servicio en Aiven)
#  Los valores después de ":" se usan solo si la variable no existe (pruebas locales).
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_denuncias?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# El plan gratuito de Aiven admite pocas conexiones: los dos prototipos la comparten
spring.datasource.hikari.maximum-pool-size=${DB_POOL:4}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

# Al arrancar se crean las tablas que falten (db/schema-mysql.sql).
# Todas las instrucciones usan IF NOT EXISTS, así que no se borra nada.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-mysql.sql
spring.sql.init.encoding=UTF-8

# ---------------------------------------------------------------------
#  JPA / HIBERNATE
#  ddl-auto=none -> Hibernate NO crea ni modifica tablas; la estructura
#  la define únicamente el script SQL (así ambos prototipos comparten
#  exactamente la misma base de datos).
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
# Muestra en consola las consultas SQL que se ejecutan (útil para aprender y depurar)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Las consultas se resuelven dentro de los servicios, no durante la respuesta HTTP
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
#  SESIÓN DEL FUNCIONARIO (se guarda en el servidor, el navegador solo
#  conserva una cookie con el identificador de sesión)
# ---------------------------------------------------------------------
# La sesión se cierra tras 30 minutos sin actividad
server.servlet.session.timeout=30m
# JavaScript no puede leer la cookie y otros sitios no pueden enviarla
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# ---------------------------------------------------------------------
#  ARCHIVOS ADJUNTOS (chat y foto de perfil)
# ---------------------------------------------------------------------
# Los archivos se guardan en la tabla archivo_almacenado de la base de datos
# (el disco de Render es temporal y el portal ciudadano corre en otro servidor)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Contraseña que reciben los usuarios de demostración creados en el primer arranque
app.demo.password=Demo1234


# true = al arrancar por primera vez se importan las 500 denuncias del Excel
# (db/importar-500-denuncias.sql, equivalente al script 03 de SQL Server)
app.demo.importar-excel=${IMPORTAR_EXCEL:true}
