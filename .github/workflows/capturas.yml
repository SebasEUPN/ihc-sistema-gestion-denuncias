# Toma capturas de pantalla del sistema (para la documentación del curso)
name: Capturas de pantalla
on:
  push:
    branches: [capturas]
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bd_denuncias
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/bd_denuncias
      DB_USER: postgres
      DB_PASSWORD: postgres
      TZ: America/Lima
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -q -DskipTests package
      - name: Arrancar
        run: |
          PORT=8080 nohup java -Duser.timezone=America/Lima -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 90); do grep -q "Started " app.log && break; sleep 2; done
          sleep 8; grep -q "Started " app.log
      - name: Capturas
        run: |
          pip install -q playwright
          python .github/scripts/capturas.py
          ls -la capturas
      - name: Guardar capturas en la rama
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add capturas
          git commit -m "Capturas de pantalla [skip ci]"
          git push
